{% extends "base.html" %}
{% block title %}{{ title }} | ReplenishAgent{% endblock %}
{% block content %}
<div class="content-narrow">
  <header class="page-header">
    <div><h1 class="page-title">{{ title }}</h1></div>
  </header>

  <section class="card">
    <div class="card-body p-4">
      <form method="post" novalidate>
        {% csrf_token %}
        {% include "includes/form_fields.html" %}
        <div class="d-flex flex-column flex-sm-row gap-2">
          <button class="btn btn-primary" type="submit">Salvar</button>
          {% if cancel_pk %}
            <a class="btn btn-outline-secondary" href="{% url cancel_url cancel_pk %}">Cancelar</a>
          {% else %}
            <a class="btn btn-outline-secondary" href="{% url cancel_url %}">Cancelar</a>
          {% endif %}
        </div>
      </form>
    </div>
  </section>
</div>
{% endblock %}
