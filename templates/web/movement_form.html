{% extends "base.html" %}
{% block title %}Nova movimentação | ReplenishAgent{% endblock %}
{% block content %}
<div class="content-narrow">
  <header class="page-header">
    <div>
      <h1 class="page-title">Registrar movimentação</h1>
      <p class="page-description">Informe o produto, tipo e quantidade movimentada.</p>
    </div>
  </header>

  <section class="card">
    <div class="card-body p-4">
      <form method="post" novalidate>
        {% csrf_token %}
        {% include "includes/form_fields.html" %}
        <div class="d-flex flex-column flex-sm-row gap-2">
          <button class="btn btn-primary" type="submit">Registrar</button>
          <a class="btn btn-outline-secondary" href="{% url 'web:movement_list' %}">Cancelar</a>
        </div>
      </form>
    </div>
  </section>
</div>
{% endblock %}
